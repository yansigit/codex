[package]
edition.workspace = true
license.workspace = true
name = "codex-http-client"
version.workspace = true

[dependencies]
bytes = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body = "1.0.1"
httpdate = { workspace = true }
native-tls = "0.2"
opentelemetry = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
zstd = { workspace = true }
wreq = { version = "=6.0.0-rc.29", features = ["stream", "gzip", "brotli", "zstd", "deflate", "socks", "prefix-symbols"] }
wreq-util = "=3.0.0-rc.14"

# btls prefixes its BoringSSL symbols but exports libssl/libcrypto search paths.
# Bundle OpenSSL on Linux so native-tls cannot accidentally link those archives.
# macOS and Windows native-tls use the platform TLS frameworks instead.
[target.'cfg(target_os = "linux")'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
rustls-platform-verifier = "0.7.0"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

[lints]
workspace = true

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lib]
doctest = false
